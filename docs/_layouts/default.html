<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #24292e;
      max-width: 980px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      background: #fff;
    }
    header {
      border-bottom: 1px solid #e1e4e8;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }
    header a { color: #0366d6; text-decoration: none; font-weight: 600; font-size: 1.25rem; }
    header a:hover { text-decoration: underline; }
    nav { margin-top: 0.5rem; font-size: 0.9rem; color: #586069; }
    nav a { color: #586069; margin-right: 1rem; }
    h1 { font-size: 2rem; margin: 1.5rem 0 1rem; padding-bottom: 0.3rem; border-bottom: 1px solid #eaecef; }
    h2 { font-size: 1.5rem; margin: 1.5rem 0 0.75rem; padding-bottom: 0.3rem; border-bottom: 1px solid #eaecef; }
    h3 { font-size: 1.25rem; margin: 1.25rem 0 0.5rem; }
    p { margin: 0.75rem 0; }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul, ol { padding-left: 2rem; margin: 0.75rem 0; }
    li { margin: 0.25rem 0; }
    code {
      background: #f6f8fa;
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 85%;
    }
    pre {
      background: #f6f8fa;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1rem 0;
    }
    pre code { background: none; padding: 0; font-size: 85%; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
      display: block;
      overflow-x: auto;
    }
    th, td { border: 1px solid #dfe2e5; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #f6f8fa; font-weight: 600; }
    blockquote {
      border-left: 4px solid #dfe2e5;
      padding: 0 1rem;
      color: #6a737d;
      margin: 1rem 0;
    }
    hr { border: none; border-top: 1px solid #eaecef; margin: 1.5rem 0; }
    img { max-width: 100%; }
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid #e1e4e8;
      color: #586069;
      font-size: 0.85rem;
    }
    .warning {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 0.75rem 1rem;
      margin: 1rem 0;
      border-radius: 0 4px 4px 0;
    }
  </style>
</head>
<body>
  <header>
    <a href="{{ site.baseurl }}/">{{ site.title }}</a>
    <nav>
      <a href="{{ site.baseurl }}/agents/README.html">智能体</a>
      <a href="{{ site.baseurl }}/scenarios/README.html">场景</a>
      <a href="{{ site.baseurl }}/architecture/STRUCTURE.html">架构</a>
      <a href="{{ site.baseurl }}/reference/API.html">API</a>
      <a href="{{ site.baseurl }}/faq/faq.html">FAQ</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>{{ site.description }}</p>
    <p><a href="https://github.com/seuzxh/RD-Agent">GitHub 仓库</a></p>
  </footer>
</body>
</html>
